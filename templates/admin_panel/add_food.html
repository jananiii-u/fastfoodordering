<!DOCTYPE html>
<html>
<head>

    <title>Add Food - Fast Food</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #faf7ef;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #7b1e2b;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            border: 1px solid #eadfca;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #7b1e2b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #641622;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7b1e2b;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🍔 Add New Food</h1>

    <div class="card">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label>Category</label>

            <select name="category" required>

                <option value="">Select Category</option>

                {% for category in categories %}

                    <option value="{{ category.id }}">
                        {{ category.name }}
                    </option>

                {% endfor %}

            </select>


            <label>Food Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter food name"
                required
            >


            <label>Description</label>

            <textarea
                name="description"
                placeholder="Enter food description"
            ></textarea>


            <label>Price</label>

            <input
                type="number"
                name="price"
                step="0.01"
                placeholder="Enter price"
                required
            >


            <label>Food Image</label>

            <input
                type="file"
                name="image"
                accept="image/*"
            >


            <button type="submit">
                ➕ Add Food
            </button>

        </form>

        <a href="{% url 'menu_management' %}" class="back">
             ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
